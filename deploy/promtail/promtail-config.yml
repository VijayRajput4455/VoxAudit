server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ---------------------------------------------------------------------------
  # 1. Scrape Structured VoxAudit File Logs (logs/voxaudit.log)
  # ---------------------------------------------------------------------------
  - job_name: voxaudit-file-logs
    static_configs:
      - targets:
          - localhost
        labels:
          job: voxaudit
          __path__: /var/log/voxaudit/*.log

    pipeline_stages:
      # Parse JSON log entry
      - json:
          expressions:
            timestamp: timestamp
            level: level
            service: service
            environment: environment
            request_id: request_id
            logger: logger
            module: module
            function: function
            line: line
            message: message
            exception: exception

      # Extract standard labels for indexed querying
      - labels:
          level:
          service:
          environment:
          logger:
          module:

      # Add timestamp parsing from the ISO string
      - timestamp:
          source: timestamp
          format: RFC3339Nano

      # Add request_id, function, line into structured metadata
      - structured_metadata:
          request_id:
          function:
          line:

  # ---------------------------------------------------------------------------
  # 2. Scrape Docker Container Stdout/Stderr (for all VoxAudit stack services)
  # ---------------------------------------------------------------------------
  - job_name: docker-containers
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=voxaudit"]
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
      - source_labels: ['container']
        target_label: 'job'

    pipeline_stages:
      - json:
          expressions:
            level: level
            service: service
            environment: environment
            request_id: request_id
            logger: logger
            module: module
            message: message
            exception: exception
      - labels:
          level:
          service:
          environment:
          logger:
          module:
