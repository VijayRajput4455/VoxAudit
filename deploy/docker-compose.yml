services:

  postgres:
    image: postgres:16
    container_name: voxaudit-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: voxaudit
      POSTGRES_USER: voxaudit
      POSTGRES_PASSWORD: voxaudit_password

    ports:
      - "5432:5432"

    volumes:
      - voxaudit_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U voxaudit -d voxaudit" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  voxaudit_postgres_data:
