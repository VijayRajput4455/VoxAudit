services:

  postgres:
    image: postgres:16
    container_name: voxaudit-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: voxaudit
      POSTGRES_USER: voxaudit
      POSTGRES_PASSWORD: voxaudit_password

    ports:
      - "5432:5432"

    volumes:
      - voxaudit_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U voxaudit -d voxaudit" ]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: voxaudit-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - voxaudit_minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  voxaudit_postgres_data:
  voxaudit_minio_data:
