apiVersion: 1

datasources:
  - name: Loki
    type: loki
    access: proxy
    url: http://loki:3100
    isDefault: true
    jsonData:
      maxLines: 5000
      derivedFields:
        - datasourceUid: Loki
          matcherRegex: '"request_id":\s*"([^"]+)"'
          name: RequestID
          url: '$${__value.raw}'
    editable: true
